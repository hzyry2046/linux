%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/realme,op6893-modem-platform.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realme op6893 cold modem platform owner

maintainers:
  - hzyry2046 <hzyry2046@163.com>

description: |
  Board-specific owner of the LK 6297 shared-memory layout and MD power
  prerequisites. Uses the same LK metadata contract as modem-handoff, which
  must not be enabled alongside this node. The four supplies must already
  be enabled with stable voltages from this boot's LK handoff. Only one cold
  power cycle is supported, without voltage changes or MD CPU release.
  An inherited ON domain is held until an explicit LK completion check and
  power-off request; probe and unused-domain work must preserve its state.
  The power-domain lives in a lookup-only child to prevent platform-bus
  attachment from powering MD1 before the platform sequence has run.

properties:
  compatible:
    const: realme,op6893-modem-platform

  memory-region:
    items:
      - description: LK tag buffer, static no-map reserved memory
      - description: AP and modem noncached shared memory, static no-map
      - description: AP and modem cached shared memory, static no-map

  memory-region-names:
    items:
      - const: tags
      - const: noncached
      - const: cached

  md-vmodem-supply:
    description: SID3 VBUCK1 VMODEM
  md-vnr-supply:
    description: SID3 VBUCK3 VNR
  md-vsram-supply:
    description: SID3 VBUCK4 VSRAM_MD
  md-vdigrf-supply:
    description: MT6359P VPU VRFDIG

  clocks:
    maxItems: 4
  clock-names:
    items:
      - const: ccif-ap
      - const: ccif-md
      - const: ccif1-ap
      - const: ccif1-md

  mediatek,spm:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: SPM syscon for resource request and domain readback
  mediatek,infracfg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Infracfg AO syscon for MD source clocks and protection readback

  power:
    type: object
    additionalProperties: false
    properties:
      power-domains:
        maxItems: 1
    required:
      - power-domains

required:
  - compatible
  - memory-region
  - memory-region-names
  - md-vmodem-supply
  - md-vnr-supply
  - md-vsram-supply
  - md-vdigrf-supply
  - clocks
  - clock-names
  - mediatek,spm
  - mediatek,infracfg
  - power

additionalProperties: false
