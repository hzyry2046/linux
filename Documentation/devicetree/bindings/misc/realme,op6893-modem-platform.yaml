%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/realme,op6893-modem-platform.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realme op6893 cold modem platform owner

maintainers:
  - hzyry2046 <hzyry2046@163.com>

description: |
  Board-specific owner of the LK 6297 shared-memory layout and MD power
  prerequisites. Uses the same LK metadata contract as modem-handoff, which
  must not be enabled alongside this node. The four supplies must already
  be enabled with stable voltages from this boot's LK handoff. Only one cold
  power cycle is supported, without voltage changes or MD CPU release.
  An inherited ON domain is held until an explicit LK completion check and
  power-off request; probe and unused-domain work must preserve its state.
  The power-domain lives in a lookup-only child to prevent platform-bus
  attachment from powering MD1 before the platform sequence has run.
  Optional ordinary AP/MD CCIF windows and data/exception IRQs allow the
  same owner to prepare SRAM and the validated 6297 shared-memory rings.
  Optional CCIF2 windows and inherited clock references belong to this same
  owner. The SCP phandle leases the separate boot-lifetime SCP runtime; it
  neither starts SCP nor establishes modem readiness at probe.

properties:
  compatible:
    const: realme,op6893-modem-platform

  reg:
    minItems: 2
    items:
      - description: Ordinary AP CCIF window
      - description: Ordinary MD CCIF window
      - description: SCP bridge AP CCIF2 window
      - description: SCP bridge MD CCIF2 window

  reg-names:
    minItems: 2
    items:
      - const: ccif-ap
      - const: ccif-md
      - const: ccif2-ap
      - const: ccif2-md

  interrupts:
    items:
      - description: CCIF data notification
      - description: CCIF exception notification

  interrupt-names:
    items:
      - const: data
      - const: exception

  memory-region:
    items:
      - description: LK tag buffer, static no-map reserved memory
      - description: AP and modem noncached shared memory, static no-map
      - description: AP and modem cached shared memory, static no-map

  memory-region-names:
    items:
      - const: tags
      - const: noncached
      - const: cached

  md-vmodem-supply:
    description: SID3 VBUCK1 VMODEM
  md-vnr-supply:
    description: SID3 VBUCK3 VNR
  md-vsram-supply:
    description: SID3 VBUCK4 VSRAM_MD
  md-vdigrf-supply:
    description: MT6359P VPU VRFDIG

  clocks:
    minItems: 4
    maxItems: 6
  clock-names:
    minItems: 4
    items:
      - const: ccif-ap
      - const: ccif-md
      - const: ccif1-ap
      - const: ccif1-md
      - const: ccif2-ap
      - const: ccif2-md

  mediatek,scp:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Unique op6893 SCP runtime provider for a generation-scoped lease

  mediatek,spm:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: SPM syscon for resource request and domain readback
  mediatek,infracfg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Infracfg AO syscon for MD source clocks and protection readback

  power:
    type: object
    additionalProperties: false
    properties:
      power-domains:
        maxItems: 1
    required:
      - power-domains

required:
  - compatible
  - memory-region
  - memory-region-names
  - md-vmodem-supply
  - md-vnr-supply
  - md-vsram-supply
  - md-vdigrf-supply
  - clocks
  - clock-names
  - mediatek,spm
  - mediatek,infracfg
  - power

additionalProperties: false

dependencies:
  reg: [reg-names, interrupts, interrupt-names]
  reg-names: [reg, interrupts, interrupt-names]
  interrupts: [reg, reg-names, interrupt-names]
  interrupt-names: [reg, reg-names, interrupts]

allOf:
  - if:
      required: ["mediatek,scp"]
    then:
      required: [reg, reg-names]
      properties:
        reg:
          minItems: 4
        reg-names:
          minItems: 4
        clocks:
          minItems: 6
        clock-names:
          minItems: 6
    else:
      properties:
        reg:
          maxItems: 2
        reg-names:
          maxItems: 2
        clocks:
          maxItems: 4
        clock-names:
          maxItems: 4
