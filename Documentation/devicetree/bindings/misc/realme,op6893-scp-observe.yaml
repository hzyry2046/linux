%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/realme,op6893-scp-observe.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realme op6893 AP-side SCP prerequisites observer

maintainers:
  - hzyry2046 <hzyry2046@163.com>

description: |
  Temporary board diagnostic for the AP TOPCK SCP mux selector and gate,
  and firmware/share reserved-memory allocation bookkeeping. It does not
  automatically access SCP registers, TCM or firmware contents,
  send mailbox/awake messages, reset SCP or establish processor readiness.
  Additional opt-ins permit explicit read-only core0 reset/status samples and
  exact-length TCM header metadata snapshots and mailbox pending words.
  Pending observation never acknowledges a message or requests an IRQ.
  An independent opt-in holds the constrained 26 MHz SCP output; it does not
  select a new parent or establish an SPM resource vote.
  No raw header or mailbox payload is exported.
  Disabled by default; not a complete SCP hardware description.

properties:
  compatible:
    const: realme,op6893-scp-observe

  clocks:
    maxItems: 1
    description: Constrained SCP bootstrap output from the existing TOPCK provider

  clock-names:
    const: scp

  reg:
    items:
      - description: Same-board SCP core0 configuration, 0x10730000 size 0x1000
      - description: TCM resource, 0x10500000 size 0x180000; only header is mapped
      - description: Mailbox 0 CLR/pending word, 0x107fb10c size 4
      - description: Mailbox 1 CLR/pending word, 0x107fc10c size 4
      - description: Mailbox 2 CLR/pending word, 0x107fd10c size 4
      - description: Mailbox 3 CLR/pending word, 0x107fe10c size 4
      - description: Mailbox 4 CLR/pending word, 0x107ff10c size 4

  reg-names:
    items:
      - const: core0
      - const: tcm
      - const: mbox0-clr
      - const: mbox1-clr
      - const: mbox2-clr
      - const: mbox3-clr
      - const: mbox4-clr

  interrupts:
    maxItems: 5

  interrupt-names:
    items:
      - const: mbox0
      - const: mbox1
      - const: mbox2
      - const: mbox3
      - const: mbox4

  mediatek,send-table:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 3
    maxItems: 192
    description: Full TX layout, channel/mailbox/words triples

  mediatek,recv-table:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 4
    maxItems: 256
    description: Full RX layout, channel/mailbox/words/response quadruples

  mediatek,topckgen:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Existing shared AP TOPCK syscon, without SCP reset attachment

  memory-region:
    items:
      - description: Static no-map SCP firmware reservation
      - description: Dynamic no-map SCP shared memory reservation

  memory-region-names:
    items:
      - const: firmware
      - const: share

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - mediatek,topckgen
  - memory-region
  - memory-region-names

additionalProperties: false

examples:
  - |
    scp-observe@10730000 {
        compatible = "realme,op6893-scp-observe";
        reg = <0x10730000 0x1000>, <0x10500000 0x180000>,
              <0x107fb10c 4>, <0x107fc10c 4>, <0x107fd10c 4>,
              <0x107fe10c 4>, <0x107ff10c 4>;
        reg-names = "core0", "tcm", "mbox0-clr", "mbox1-clr",
                    "mbox2-clr", "mbox3-clr", "mbox4-clr";
        interrupts = <0 436 4>, <0 437 4>, <0 438 4>, <0 439 4>, <0 440 4>;
        interrupt-names = "mbox0", "mbox1", "mbox2", "mbox3", "mbox4";
        mediatek,topckgen = <&topckgen>;
        memory-region = <&scp_firmware_mem>, <&scp_share_mem>;
        memory-region-names = "firmware", "share";
        status = "disabled";
    };
