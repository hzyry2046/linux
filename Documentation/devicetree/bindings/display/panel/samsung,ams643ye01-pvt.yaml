%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/samsung,ams643ye01-pvt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung AMS643YE01 PVT AMOLED DSI panel

maintainers:
  - Neil Armstrong <neil.armstrong@linaro.org>

description:
  1080x2400 AMOLED panel using four MIPI DSI data lanes and Display
  Stream Compression in command mode.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: samsung,ams643ye01-pvt

  reg:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  vci-supply:
    description: Analog panel power supply.

  vdd-supply:
    description: Panel core power supply.

required:
  - compatible
  - reg
  - reset-gpios
  - vci-supply
  - vdd-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "samsung,ams643ye01-pvt";
            reg = <0>;
            reset-gpios = <&pio 42 GPIO_ACTIVE_LOW>;
            vci-supply = <&lcd_vci>;
            vdd-supply = <&lcd_vdd>;
        };
    };
